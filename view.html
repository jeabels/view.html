<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RESIBOOTH — Your Photo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f4f6;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px 16px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #8b0000;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8b0000;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: #ffffff;
            border-radius: 18px;
            padding: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .label {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #6b7280;

            margin-bottom: 12px;
            text-transform: uppercase;
        }

        #photo {
            width: 100%;
            height: auto;
            display: block;

            border-radius: 10px;
            background: #eeeeee;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .error {
            text-align: center;
            padding: 35px 20px;
        }

        .error h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .error p {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        .actions {
            width: 100%;
            max-width: 420px;

            display: flex;
            flex-direction: column;
            gap: 10px;

            margin-top: 14px;
        }

        .button {
            width: 100%;

            padding: 16px;

            border-radius: 100px;
            border: none;

            font-size: 15px;
            font-weight: 700;

            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        .download {
            background: #8b0000;
            color: white;
        }

        .back {
            background: white;
            color: #111827;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .note {
            max-width: 360px;

            margin-top: 16px;

            text-align: center;

            font-size: 12px;
            line-height: 1.5;

            color: #6b7280;
        }

        .thanks {
            margin-top: 18px;

            font-size: 10px;
            letter-spacing: 2px;

            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="title">
            RESIBOOTH
        </div>

        <div class="subtitle">
            BY SNAPS STUDIO
        </div>

    </div>


    <div class="card" id="content">

        <div class="loading">
            Loading your photo...
        </div>

    </div>


    <div
        class="actions"
        id="actions"
        style="display:none;"
    >

        <a
            id="downloadButton"
            class="button download"
            href="#"
            target="_blank"
            rel="noopener"
        >
            Download Photo
        </a>

    </div>


    <p class="note" id="note">
        Your photo is being loaded from Supabase.
    </p>


    <div class="thanks">
        *** THANK YOU FOR SNAPPING ***
    </div>


    <!-- ============================================================
         SUPABASE LIBRARY
         IMPORTANT: THIS MUST COME BEFORE OUR JAVASCRIPT
         ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* ============================================================
           SUPABASE CONFIGURATION
           ============================================================ */

        const SUPABASE_URL =
            'https://kjfghpchexnzxeruqssp.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_owdTu7EOouBkNZSkvvM8QQ_1vqRAZCI';


        /* ============================================================
           CREATE SUPABASE CLIENT
           ============================================================ */

        if (!window.supabase) {
            throw new Error(
                'Supabase JavaScript library failed to load.'
            );
        }

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ============================================================
           READ QR PARAMETERS
           
           QR URL example:

           https://jeabels.github.io/view.html/view.html
           ?id=20260909-123456-a1b2c3d4
           &v=color
           ============================================================ */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const id =
            params.get('id');


        const variant =
            params.get('v') === 'bw'
                ? 'bw'
                : 'color';


        /* ============================================================
           PAGE ELEMENTS
           ============================================================ */

        const content =
            document.getElementById('content');

        const actions =
            document.getElementById('actions');

        const downloadButton =
            document.getElementById('downloadButton');

        const note =
            document.getElementById('note');


        /* ============================================================
           VALIDATE PHOTO ID
           ============================================================ */

        function validPhotoId(value) {

            if (!value) {
                return false;
            }

            /*
             * Expected format:

             * 20260909-123456-a1b2c3d4
             */

            return /^\d{8}-\d{6}-[0-9a-f]{8}$/.test(
                value
            );
        }


        /* ============================================================
           GET SUPABASE PHOTO URL
           ============================================================ */

        function getPhotoUrl(filePath) {

            const {
                data,
                error
            } =
                supabaseClient.storage
                    .from('photos')
                    .getPublicUrl(filePath);


            if (error) {
                console.error(
                    'Supabase URL error:',
                    error
                );

                throw error;
            }


            if (
                !data ||
                !data.publicUrl
            ) {

                throw new Error(
                    'Could not create Supabase public URL.'
                );
            }


            return data.publicUrl;
        }


        /* ============================================================
           LOAD PHOTO
           ============================================================ */

        async function loadPhoto() {

            try {

                /* ----------------------------------------------------
                   Validate ID
                   ---------------------------------------------------- */

                if (!validPhotoId(id)) {

                    throw new Error(
                        'Invalid or missing photo ID.'
                    );
                }


                console.log(
                    'Photo ID:',
                    id
                );

                console.log(
                    'Variant:',
                    variant
                );


                /* ----------------------------------------------------
                   Build exact Supabase file path

                   This MUST match script.js:

                   p/{id}-color.jpg
                   p/{id}-bw.jpg
                   ---------------------------------------------------- */

                const filePath =
                    `p/${id}-${variant}.jpg`;


                console.log(
                    'Supabase file:',
                    filePath
                );


                /* ----------------------------------------------------
                   Get public URL
                   ---------------------------------------------------- */

                const photoUrl =
                    getPhotoUrl(filePath);


                console.log(
                    'Supabase photo URL:',
                    photoUrl
                );


                /* ----------------------------------------------------
                   Test the image before displaying it
                   ---------------------------------------------------- */

                const testImage =
                    new Image();


                testImage.onload =
                    function() {

                        console.log(
                            'Photo loaded successfully.'
                        );

                        showPhoto(
                            photoUrl
                        );
                    };


                testImage.onerror =
                    function() {

                        console.error(
                            'Photo could not be loaded:',
                            photoUrl
                        );

                        showError(
                            'The photo could not be found. Make sure the Supabase photos bucket is public and the file exists.'
                        );
                    };


                testImage.src =
                    photoUrl;

            }

            catch (error) {

                console.error(
                    'Photo viewer error:',
                    error
                );

                showError(
                    'We could not load your photo.'
                );
            }
        }


        /* ============================================================
           SHOW PHOTO
           ============================================================ */

        function showPhoto(photoUrl) {

            const label =
                variant === 'bw'
                    ? 'Black & White Version'
                    : 'Colour Version';


            /* --------------------------------------------------------
               Display image
               -------------------------------------------------------- */

            content.innerHTML = `

                <div class="label">
                    ${label}
                </div>

                <img
                    id="photo"
                    src="${photoUrl}"
                    alt="Your RESIBOOTH photo"
                    loading="eager"
                >

            `;


            /* --------------------------------------------------------
               Show download button
               -------------------------------------------------------- */

            actions.style.display =
                'flex';


            /* --------------------------------------------------------
               Set download link

               IMPORTANT:
               The download attribute may not work on every
               mobile browser for a cross-origin Supabase URL.

               target="_blank" lets the user open the image
               even if the browser ignores the download attribute.
               -------------------------------------------------------- */

            downloadButton.href =
                photoUrl;


            downloadButton.download =
                `RESIBOOTH-${id}-${variant}.jpg`;


            note.textContent =
                'Tap Download Photo to save your photo to your device.';


            console.log(
                'Photo successfully displayed.'
            );
        }


        /* ============================================================
           SHOW ERROR
           ============================================================ */

        function showError(message) {

            content.innerHTML = `

                <div class="error">

                    <h2>
                        Photo unavailable
                    </h2>

                    <p>
                        ${message}
                    </p>

                </div>

            `;


            actions.style.display =
                'none';


            note.textContent =
                'Please scan the QR code again from the photobooth.';
        }


        /* ============================================================
           START PHOTO LOADING
           ============================================================ */

        loadPhoto();

    </script>

</body>
</html>
