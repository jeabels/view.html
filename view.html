<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RESIBOOTH – Your Photo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f4f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .photo-wrapper {
      width: 100%;
      background: #f3f4f6;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      margin-bottom: 20px;
    }

    #photo {
      display: none;
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
    }

    .loading {
      padding: 50px 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .error {
      display: none;
      padding: 35px 20px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .error-message {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      display: none;
      gap: 10px;
      flex-direction: column;
    }

    button,
    .download-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform 0.15s ease;
    }

    button:active,
    .download-button:active {
      transform: scale(0.98);
    }

    .download-button {
      background: #111827;
      color: #ffffff;
    }

    .save-button {
      background: #e5e7eb;
      color: #111827;
    }

    .info {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 10px;
      color: #6b7280;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }

    .footer {
      margin-top: 18px;
      color: #9ca3af;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="brand">
        RESIBOOTH
      </div>

      <h1>Your Photo</h1>

      <p class="subtitle" id="subtitle">
        Loading your photo...
      </p>

      <div class="photo-wrapper">

        <div class="loading" id="loading">
          Loading photo...
        </div>

        <img
          id="photo"
          alt="Your RESIBOOTH photo"
        >

        <div class="error" id="error">
          <div class="error-title">
            We couldn't load your photo
          </div>

          <div class="error-message" id="error-message">
            Please try scanning the QR code again.
          </div>
        </div>

      </div>

      <div class="buttons" id="buttons">

        <a
          id="download-button"
          class="download-button"
          href="#"
          download
        >
          DOWNLOAD PHOTO
        </a>

        <button
          type="button"
          class="save-button"
          id="save-button"
        >
          SAVE PHOTO
        </button>

      </div>

      <div class="info" id="info"></div>

      <div class="footer">
        RESIBOOTH PHOTO DELIVERY
      </div>

    </section>

  </main>

  <script>
    /* ============================================================
       RESIBOOTH PHOTO VIEWER
       ============================================================ */

    const SUPABASE_URL =
      'https://kjfghpchexnzxeruqssp.supabase.co';

    const BUCKET_NAME = 'photos';

    const EXPECTED_PROJECT =
      'kjfghpchexnzxeruqssp';


    /* ============================================================
       ELEMENTS
       ============================================================ */

    const photo = document.getElementById('photo');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const errorMessage = document.getElementById('error-message');
    const buttons = document.getElementById('buttons');
    const downloadButton =
      document.getElementById('download-button');
    const saveButton =
      document.getElementById('save-button');
    const subtitle =
      document.getElementById('subtitle');
    const info =
      document.getElementById('info');


    /* ============================================================
       GET QR PARAMETERS
       ============================================================ */

    const params = new URLSearchParams(
      window.location.search
    );

    const projectRef = params.get('r');
    const bucket = params.get('b');
    const photoId = params.get('id');
    const variant = params.get('v');


    /* ============================================================
       VALIDATE QR DATA
       ============================================================ */

    function validateParameters() {

      if (!projectRef) {
        throw new Error(
          'The QR code does not contain a project reference.'
        );
      }

      if (!photoId) {
        throw new Error(
          'The QR code does not contain a photo ID.'
        );
      }

      if (!variant) {
        throw new Error(
          'The QR code does not contain a photo version.'
        );
      }

      if (projectRef !== EXPECTED_PROJECT) {
        throw new Error(
          'This QR code belongs to a different project.'
        );
      }

      if (bucket && bucket !== BUCKET_NAME) {
        throw new Error(
          'The photo bucket is invalid.'
        );
      }

      if (
        variant !== 'color' &&
        variant !== 'bw'
      ) {
        throw new Error(
          'The photo version is invalid.'
        );
      }

      if (!/^[a-zA-Z0-9_-]+$/.test(photoId)) {
        throw new Error(
          'The photo ID is invalid.'
        );
      }
    }


    /* ============================================================
       BUILD SUPABASE PHOTO PATH
       ============================================================ */

    function getFilePath() {

      return (
        'p/' +
        photoId +
        '-' +
        variant +
        '.jpg'
      );

    }


    /* ============================================================
       BUILD PUBLIC SUPABASE URL
       ============================================================ */

    function getPhotoUrl() {

      const filePath = getFilePath();

      return (
        SUPABASE_URL +
        '/storage/v1/object/public/' +
        encodeURIComponent(BUCKET_NAME) +
        '/' +
        filePath
          .split('/')
          .map(part => encodeURIComponent(part))
          .join('/')
      );

    }


    /* ============================================================
       SHOW ERROR
       ============================================================ */

    function showError(message) {

      console.error(
        'Photo viewer error:',
        message
      );

      loading.style.display = 'none';

      photo.style.display = 'none';

      buttons.style.display = 'none';

      errorBox.style.display = 'block';

      errorMessage.textContent =
        message ||
        'Please try scanning the QR code again.';

      subtitle.textContent =
        'Unable to load your photo.';

    }


    /* ============================================================
       LOAD PHOTO
       ============================================================ */

    function loadPhoto() {

      try {

        validateParameters();

        const photoUrl = getPhotoUrl();

        console.log(
          'Photo ID:',
          photoId
        );

        console.log(
          'Variant:',
          variant
        );

        console.log(
          'Photo URL:',
          photoUrl
        );


        /* --------------------------------------------------------
           Update text
           -------------------------------------------------------- */

        if (variant === 'bw') {

          subtitle.textContent =
            'Your black & white photo';

        } else {

          subtitle.textContent =
            'Your colour photo';

        }


        /* --------------------------------------------------------
           Load image
           -------------------------------------------------------- */

        photo.onload = function() {

          loading.style.display = 'none';

          errorBox.style.display = 'none';

          photo.style.display = 'block';

          buttons.style.display = 'flex';

          info.style.display = 'block';

          info.textContent =
            'Photo ID: ' +
            photoId;

        };


        photo.onerror = function() {

          showError(
            'We could not load your photo. ' +
            'Please make sure the Supabase photos bucket ' +
            'is public and that the QR code is correct.'
          );

        };


        photo.src = photoUrl;


        /* --------------------------------------------------------
           Download button
           -------------------------------------------------------- */

        downloadButton.href = photoUrl;

        downloadButton.download =
          'resibooth-' +
          photoId +
          '-' +
          variant +
          '.jpg';


        /* --------------------------------------------------------
           Save button
           -------------------------------------------------------- */

        saveButton.onclick = function() {

          const link =
            document.createElement('a');

          link.href = photoUrl;

          link.download =
            'resibooth-' +
            photoId +
            '-' +
            variant +
            '.jpg';

          document.body.appendChild(link);

          link.click();

          document.body.removeChild(link);

        };

      } catch (error) {

        showError(
          error.message ||
          'We could not load your photo.'
        );

      }

    }


    /* ============================================================
       START
       ============================================================ */

    loadPhoto();

  </script>

</body>
</html>
