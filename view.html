<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>RESIBOOTH — Your Photo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      background: #f4f4f6;
      color: #111827;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: #8B0000;

      font-family: Georgia, serif;

      font-size: 28px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;

      line-height: 1;
    }

    .sub {
      margin-top: 6px;

      color: #8B0000;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      border: 1px solid rgba(0, 0, 0, 0.08);

      border-radius: 18px;

      padding: 14px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .label {
      text-align: center;

      color: #6b7280;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .photo {
      width: 100%;
      height: auto;

      display: block;

      border-radius: 8px;
    }

    .actions {
      width: 100%;
      max-width: 420px;

      display: flex;
      flex-direction: column;

      gap: 10px;

      margin-top: 12px;
    }

    .button {
      width: 100%;

      padding: 16px;

      border-radius: 999px;

      text-decoration: none;
      text-align: center;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .button:active {
      transform: scale(0.98);
    }

    .primary {
      background: #8B0000;
      color: #ffffff;

      box-shadow:
        0 8px 20px rgba(139, 0, 0, 0.22);
    }

    .secondary {
      background: #ffffff;
      color: #111827;

      border: 1px solid rgba(0, 0, 0, 0.10);
    }

    .message {
      max-width: 380px;

      text-align: center;

      color: #6b7280;

      font-size: 13px;
      line-height: 1.5;

      margin-top: 14px;
    }

    .loading {
      text-align: center;

      padding: 40px 10px;

      color: #6b7280;

      font-size: 14px;
    }

    .error {
      text-align: center;

      padding: 30px 10px;
    }

    .error h2 {
      font-size: 19px;

      margin-bottom: 8px;
    }

    .error p {
      color: #6b7280;

      font-size: 13px;
      line-height: 1.5;
    }

    .thanks {
      margin-top: 18px;

      color: #9ca3af;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.5px;

      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>RESIBOOTH</h1>

    <div class="sub">
      BY SNAPS STUDIO
    </div>
  </header>


  <!-- PHOTO CARD -->
  <div
    id="photo-card"
    class="card"
  >
    <div class="loading">
      Loading your photo...
    </div>
  </div>


  <!-- BUTTONS -->
  <div
    id="actions"
    class="actions"
    style="display: none;"
  >
  </div>


  <!-- MESSAGE -->
  <p
    id="message"
    class="message"
  ></p>


  <div class="thanks">
    *** THANK YOU FOR SNAPPING ***
  </div>


  <script>

    /*
     * ============================================================
     * RESIBOOTH PHOTO VIEWER
     * ============================================================
     *
     * The QR code sends the Supabase public image URL here.
     *
     * Example:
     *
     * view.html?photo=https%3A%2F%2Fxxxxx.supabase.co%2Fstorage...
     *
     * No Supabase secret key is needed on this page.
     *
     * ============================================================
     */


    const photoCard =
      document.getElementById("photo-card");

    const actions =
      document.getElementById("actions");

    const message =
      document.getElementById("message");


    /*
     * Read URL parameters
     */
    const params =
      new URLSearchParams(
        window.location.search
      );


    const photoUrl =
      params.get("photo");


    const otherPhotoUrl =
      params.get("other");


    const variant =
      params.get("v") === "bw"
        ? "bw"
        : "color";


    /*
     * ============================================================
     * CHECK PHOTO URL
     * ============================================================
     */

    if (!photoUrl) {

      showError(
        "Photo not found",
        "This QR code does not contain a valid photo link."
      );

    } else {

      loadPhoto();

    }


    /*
     * ============================================================
     * LOAD PHOTO
     * ============================================================
     */

    function loadPhoto() {

      const image =
        new Image();


      /*
       * Prevent broken image from
       * being displayed before loading.
       */
      image.style.display =
        "none";


      image.onload =
        function () {

          displayPhoto(
            image
          );

        };


      image.onerror =
        function () {

          showError(
            "Photo unavailable",
            "The photo could not be loaded. It may have been removed or the link may be invalid."
          );

        };


      /*
       * Add cache-busting parameter
       * so the browser doesn't show
       * an old cached photo.
       */
      const separator =
        photoUrl.includes("?")
          ? "&"
          : "?";


      image.src =
        photoUrl +
        separator +
        "t=" +
        Date.now();

    }


    /*
     * ============================================================
     * DISPLAY PHOTO
     * ============================================================
     */

    function displayPhoto(image) {

      /*
       * Clear loading screen
       */
      photoCard.innerHTML = "";


      /*
       * Version label
       */
      const label =
        document.createElement("div");


      label.className =
        "label";


      label.textContent =
        variant === "bw"
          ? "Black & White Version"
          : "Colour Version";


      /*
       * Photo
       */
      image.className =
        "photo";


      image.alt =
        "Your RESIBOOTH photo";


      image.style.display =
        "block";


      /*
       * Add to card
       */
      photoCard.appendChild(
        label
      );


      photoCard.appendChild(
        image
      );


      /*
       * Display action buttons
       */
      actions.style.display =
        "flex";


      /*
       * ==========================================================
       * DOWNLOAD BUTTON
       * ==========================================================
       */

      const downloadButton =
        document.createElement("a");


      downloadButton.className =
        "button primary";


      downloadButton.textContent =
        "DOWNLOAD PHOTO";


      /*
       * Use Supabase download parameter
       */
      const downloadSeparator =
        photoUrl.includes("?")
          ? "&"
          : "?";


      downloadButton.href =
        photoUrl +
        downloadSeparator +
        "download=" +
        encodeURIComponent(
          "RESIBOOTH_" +
          (
            variant === "bw"
              ? "Black_White"
              : "Colour"
          ) +
          "_Photo.png"
        );


      downloadButton.target =
        "_blank";


      downloadButton.rel =
        "noopener";


      actions.appendChild(
        downloadButton
      );


      /*
       * ==========================================================
       * OTHER VERSION BUTTON
       * ==========================================================
       *
       * If the QR code contains another
       * Supabase public URL, show it.
       *
       * ==========================================================
       */

      if (otherPhotoUrl) {

        const otherButton =
          document.createElement("a");


        otherButton.className =
          "button secondary";


        otherButton.textContent =
          variant === "bw"
            ? "VIEW COLOUR VERSION"
            : "VIEW BLACK & WHITE VERSION";


        /*
         * Build new URL
         */
        const currentPage =
          window.location.pathname;


        const otherVariant =
          variant === "bw"
            ? "color"
            : "bw";


        const otherLink =
          currentPage +
          "?photo=" +
          encodeURIComponent(
            otherPhotoUrl
          ) +
          "&v=" +
          otherVariant;


        /*
         * If we have an additional URL
         * for the opposite version,
         * preserve it as well.
         */
        otherButton.href =
          otherLink;


        actions.appendChild(
          otherButton
        );

      }


      message.textContent =
        "Your photo is ready. Tap the button above to save it to your phone.";

    }


    /*
     * ============================================================
     * ERROR MESSAGE
     * ============================================================
     */

    function showError(
      title,
      description
    ) {

      photoCard.innerHTML =
        "";


      const error =
        document.createElement("div");


      error.className =
        "error";


      const heading =
        document.createElement("h2");


      heading.textContent =
        title;


      const text =
        document.createElement("p");


      text.textContent =
        description;


      error.appendChild(
        heading
      );


      error.appendChild(
        text
      );


      photoCard.appendChild(
        error
      );


      actions.style.display =
        "none";


      message.textContent =
        "";

    }

  </script>

</body>
</html>
