<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RESIBOOTH — Your Photo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f4f6;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px 16px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #8b0000;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8b0000;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: #ffffff;
            border-radius: 18px;
            padding: 16px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .label {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #6b7280;

            margin-bottom: 12px;
            text-transform: uppercase;
        }

        #photo {
            width: 100%;
            height: auto;
            display: block;

            border-radius: 10px;
            background: #eeeeee;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .error {
            text-align: center;
            padding: 35px 20px;
        }

        .error h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .error p {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        .actions {
            width: 100%;
            max-width: 420px;

            display: flex;
            flex-direction: column;
            gap: 10px;

            margin-top: 14px;
        }

        .button {
            width: 100%;

            padding: 16px;

            border-radius: 100px;
            border: none;

            font-size: 15px;
            font-weight: 700;

            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        .download {
            background: #8b0000;
            color: #ffffff;

            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.20);
        }

        .download:hover {
            opacity: 0.9;
        }

        .back {
            background: #ffffff;
            color: #111827;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .note {
            max-width: 360px;

            margin-top: 16px;

            text-align: center;

            font-size: 12px;
            line-height: 1.5;

            color: #6b7280;
        }

        .thanks {
            margin-top: 18px;

            font-size: 10px;
            letter-spacing: 2px;

            color: #9ca3af;
        }
    </style>
</head>


<body>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="header">

        <div class="title">
            RESIBOOTH
        </div>

        <div class="subtitle">
            BY SNAPS STUDIO
        </div>

    </header>


    <!-- =========================================================
         PHOTO CARD
         ========================================================= -->

    <div
        class="card"
        id="content"
    >

        <div class="loading">
            Loading your photo...
        </div>

    </div>


    <!-- =========================================================
         DOWNLOAD BUTTON
         ========================================================= -->

    <div
        class="actions"
        id="actions"
        style="display: none;"
    >

        <a
            id="downloadButton"
            class="button download"
            href="#"
            target="_blank"
            rel="noopener"
        >
            Download Photo
        </a>

    </div>


    <!-- =========================================================
         MESSAGE
         ========================================================= -->

    <p
        class="note"
        id="note"
    >
        Your photo is being loaded.
    </p>


    <div class="thanks">
        *** THANK YOU FOR SNAPPING ***
    </div>


    <!-- =========================================================
         SUPABASE JAVASCRIPT LIBRARY
         
         IMPORTANT:
         This MUST load before createClient() is called.
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================================
           SUPABASE CONFIGURATION
           ========================================================= */

        const SUPABASE_URL =
            'https://kjfghpchexnzxeruqssp.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_owdTu7EOouBkNZSkvvM8QQ_1vqRAZCI';


        /* =========================================================
           CHECK SUPABASE LIBRARY
           ========================================================= */

        if (!window.supabase) {

            document.getElementById('content').innerHTML = `
                <div class="error">

                    <h2>
                        Viewer Error
                    </h2>

                    <p>
                        Supabase could not be loaded.
                        Please try scanning the QR code again.
                    </p>

                </div>
            `;

            throw new Error(
                'Supabase JavaScript library failed to load.'
            );
        }


        /* =========================================================
           CREATE SUPABASE CLIENT
           ========================================================= */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           READ QR CODE PARAMETERS
           
           The QR generated by script.js will contain:

           ?id=PHOTO-ID&v=color

           OR

           ?id=PHOTO-ID&v=bw
           ========================================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const photoId =
            urlParams.get('id');


        const variantParam =
            urlParams.get('v');


        /* =========================================================
           DETERMINE VARIANT
           ========================================================= */

        const variant =
            variantParam === 'bw'
                ? 'bw'
                : 'color';


        /* =========================================================
           PAGE ELEMENTS
           ========================================================= */

        const content =
            document.getElementById('content');


        const actions =
            document.getElementById('actions');


        const downloadButton =
            document.getElementById('downloadButton');


        const note =
            document.getElementById('note');


        /* =========================================================
           VALIDATE PHOTO ID
           
           script.js creates IDs like:

           20260909-173500-a1b2c3d4

           Format:

           YYYYMMDD-HHMMSS-8 HEX CHARACTERS
           ========================================================= */

        function isValidPhotoId(id) {

            if (!id) {
                return false;
            }

            return /^\d{8}-\d{6}-[0-9a-f]{8}$/i.test(id);
        }


        /* =========================================================
           CREATE SUPABASE FILE PATH
           
           This MUST match script.js:

           Color:
           p/{id}-color.jpg

           B&W:
           p/{id}-bw.jpg
           ========================================================= */

        function getFilePath(id, variant) {

            return `p/${id}-${variant}.jpg`;
        }


        /* =========================================================
           GET PUBLIC SUPABASE URL
           ========================================================= */

        function getPublicPhotoUrl(filePath) {

            const result =
                supabaseClient.storage
                    .from('photos')
                    .getPublicUrl(filePath);


            if (
                !result ||
                !result.data ||
                !result.data.publicUrl
            ) {

                throw new Error(
                    'Could not create the Supabase photo URL.'
                );
            }


            return result.data.publicUrl;
        }


        /* =========================================================
           SHOW ERROR
           ========================================================= */

        function showError(message) {

            content.innerHTML = `

                <div class="error">

                    <h2>
                        Photo unavailable
                    </h2>

                    <p>
                        ${message}
                    </p>

                </div>

            `;


            actions.style.display = 'none';


            note.textContent =
                'Please scan the QR code again from the photobooth.';
        }


        /* =========================================================
           SHOW PHOTO
           ========================================================= */

        function showPhoto(photoUrl) {

            const label =
                variant === 'bw'
                    ? 'Black & White Version'
                    : 'Colour Version';


            content.innerHTML = `

                <div class="label">
                    ${label}
                </div>

                <img
                    id="photo"
                    src="${photoUrl}"
                    alt="Your RESIBOOTH photo"
                >

            `;


            /* -----------------------------------------------------
               Show download button
               ----------------------------------------------------- */

            actions.style.display = 'flex';


            downloadButton.href =
                photoUrl;


            downloadButton.download =
                `RESIBOOTH-${photoId}-${variant}.jpg`;


            note.textContent =
                'Tap Download Photo to save your photo to your device.';
        }


        /* =========================================================
           LOAD PHOTO
           ========================================================= */

        async function loadPhoto() {

            try {

                /* -------------------------------------------------
                   Check ID
                   ------------------------------------------------- */

                if (!isValidPhotoId(photoId)) {

                    showError(
                        'The QR code does not contain a valid photo ID.'
                    );

                    return;
                }


                /* -------------------------------------------------
                   Build Supabase path
                   ------------------------------------------------- */

                const filePath =
                    getFilePath(
                        photoId,
                        variant
                    );


                console.log(
                    'Photo ID:',
                    photoId
                );


                console.log(
                    'Photo variant:',
                    variant
                );


                console.log(
                    'Supabase file path:',
                    filePath
                );


                /* -------------------------------------------------
                   Get public URL
                   ------------------------------------------------- */

                const photoUrl =
                    getPublicPhotoUrl(
                        filePath
                    );


                console.log(
                    'Supabase public URL:',
                    photoUrl
                );


                /* -------------------------------------------------
                   Check that image actually exists
                   ------------------------------------------------- */

                const image =
                    new Image();


                image.onload = function() {

                    console.log(
                        'Photo loaded successfully.'
                    );


                    showPhoto(
                        photoUrl
                    );
                };


                image.onerror = function() {

                    console.error(
                        'Photo could not be loaded:',
                        photoUrl
                    );


                    showError(
                        'The photo could not be found. Please check that the Supabase "photos" bucket is public and that the photo was uploaded successfully.'
                    );
                };


                image.src =
                    photoUrl;

            }

            catch (error) {

                console.error(
                    'Photo viewer error:',
                    error
                );


                showError(
                    'We could not load your photo. Please try scanning the QR code again.'
                );
            }
        }


        /* =========================================================
           START
           ========================================================= */

        loadPhoto();

    </script>

</body>
</html>
