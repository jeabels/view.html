<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESIBOOTH — Your Photo</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-red: #8B0000;
      --accent-red-hover: #660000;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --glass-bg: #f9f7f7;
      --text-main: #111827;
      --text-sub: #6b7280;
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #ede0e0 0%, #f4f4f6 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 18px 48px;
    }

    .mono-font { font-family: 'Space Mono', ui-monospace, monospace; }

    .page { width: 100%; max-width: 420px; }

    .brand-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-bottom: 22px; width: 100%;
    }
    .brand-title {
      font-family: 'Cinzel', serif; font-size: 30px; font-weight: 700;
      color: var(--accent-red); letter-spacing: 4px; line-height: 1; text-transform: uppercase;
    }
    .brand-sub {
      font-size: 11px; font-weight: 800; color: var(--accent-red);
      letter-spacing: 2.5px; line-height: 1.1; margin-top: 6px; text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    h1 {
      font-size: 21px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .photo-wrapper {
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 280px;
      margin-bottom: 20px;
    }

    #photo {
      display: none;
      width: 100%;
      height: auto;
      max-height: 72vh;
      object-fit: contain;
    }

    .loading {
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
    }

    .error { display: none; padding: 40px 20px; }

    .error-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .error-message {
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.55;
    }

    .buttons {
      display: none;
      gap: 10px;
      flex-direction: column;
    }

    button, .download-button {
      width: 100%;
      border: none;
      border-radius: 100px;
      padding: 15px 18px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:active, .download-button:active { transform: scale(0.98); }

    .download-button {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 8px 20px rgba(139, 0, 0, 0.25);
    }
    .download-button:active { background: var(--accent-red-hover); }

    .save-button {
      background: var(--glass-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .info {
      display: none;
      margin-top: 18px;
      padding: 11px 14px;
      background: var(--glass-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-sub);
      font-size: 10.5px;
      letter-spacing: 0.3px;
      line-height: 1.5;
      word-break: break-word;
    }

    .footer {
      margin-top: 22px;
      color: var(--text-sub);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.6;
    }

    .retry-button {
      margin-top: 18px;
      background: var(--accent-red);
      color: #fff;
      width: auto;
      display: inline-block;
      padding: 12px 26px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand-header">
      <div class="brand-title">Resibooth</div>
      <div class="brand-sub">By Snaps Studio</div>
    </div>

    <section class="card">

      <h1>Your Photo</h1>
      <p class="subtitle" id="subtitle">Loading your photo…</p>

      <div class="photo-wrapper">
        <div class="loading" id="loading">Loading photo…</div>

        <img id="photo" alt="Your RESIBOOTH photo">

        <div class="error" id="error">
          <div class="error-title">We couldn't load your photo</div>
          <div class="error-message" id="error-message">Please try scanning the QR code again.</div>
          <button type="button" class="retry-button" id="retry-button">TRY AGAIN</button>
        </div>
      </div>

      <div class="buttons" id="buttons">
        <a id="download-button" class="download-button" href="#" target="_blank" rel="noopener">DOWNLOAD PHOTO</a>
        <button type="button" class="save-button" id="save-button">SAVE PHOTO</button>
      </div>

      <div class="info mono-font" id="info"></div>

      <p class="footer">*** Thank you for snapping ***<br>Follow us @SnapsStudio</p>

    </section>

  </main>


  <script>

    /* ============================================================
       RESIBOOTH PHOTO VIEWER
       Same Supabase logic as before — only the look changed to match
       the kiosk's own branding. Nothing about how the photo is fetched,
       validated, or downloaded has been touched.
       ============================================================ */

    const SUPABASE_URL =
      'https://kjfghpchexnzxeruqssp.supabase.co';

    const BUCKET_NAME =
      'photos';

    const EXPECTED_PROJECT =
      'kjfghpchexnzxeruqssp';


    /* ============================================================
       PAGE ELEMENTS
       ============================================================ */

    const photo =
      document.getElementById('photo');

    const loading =
      document.getElementById('loading');

    const errorBox =
      document.getElementById('error');

    const errorMessage =
      document.getElementById('error-message');

    const buttons =
      document.getElementById('buttons');

    const downloadButton =
      document.getElementById('download-button');

    const saveButton =
      document.getElementById('save-button');

    const subtitle =
      document.getElementById('subtitle');

    const info =
      document.getElementById('info');

    const retryButton =
      document.getElementById('retry-button');


    /* ============================================================
       READ QR PARAMETERS
       ============================================================ */

    const params =
      new URLSearchParams(
        window.location.search
      );

    /*
     * The QR code can contain:
     *
     * ?r=PROJECT&b=photos&id=PHOTO-ID&v=color
     *
     * or:
     *
     * ?id=PHOTO-ID&v=color
     *
     * The project reference is OPTIONAL.
     */

    const projectRef =
      params.get('r');

    const bucketParam =
      params.get('b');

    const photoId =
      params.get('id');

    const variant =
      params.get('v');


    /* ============================================================
       VALIDATE PARAMETERS
       ============================================================ */

    function validateParameters() {

      /*
       * Project reference is optional.
       *
       * This fixes the problem where the QR code does not
       * contain "r".
       */

      if (
        projectRef &&
        projectRef !== EXPECTED_PROJECT
      ) {

        throw new Error(
          'This QR code belongs to a different project.'
        );

      }


      /*
       * Bucket is optional.
       */

      if (
        bucketParam &&
        bucketParam !== BUCKET_NAME
      ) {

        throw new Error(
          'The photo bucket is invalid.'
        );

      }


      /*
       * Photo ID is required.
       */

      if (!photoId) {

        throw new Error(
          'The QR code does not contain a photo ID.'
        );

      }


      /*
       * Variant is required.
       */

      if (!variant) {

        throw new Error(
          'The QR code does not contain a photo version.'
        );

      }


      /*
       * Only these two versions are allowed.
       */

      if (
        variant !== 'color' &&
        variant !== 'bw'
      ) {

        throw new Error(
          'The photo version is invalid.'
        );

      }


      /*
       * Your script.js creates IDs like:
       *
       * 20260910-012345-a1b2c3d4
       */

      if (
        !/^[a-zA-Z0-9_-]+$/.test(photoId)
      ) {

        throw new Error(
          'The photo ID is invalid.'
        );

      }

    }


    /* ============================================================
       BUILD SUPABASE FILE PATH
       ============================================================ */

    function getFilePath() {

      return (
        'p/' +
        photoId +
        '-' +
        variant +
        '.jpg'
      );

    }


    /* ============================================================
       BUILD SUPABASE PUBLIC URL
       ============================================================ */

    function getPhotoUrl() {

      const filePath =
        getFilePath();

      const encodedBucket =
        encodeURIComponent(
          BUCKET_NAME
        );

      const encodedPath =
        filePath
          .split('/')
          .map(
            part =>
              encodeURIComponent(part)
          )
          .join('/');

      return (
        SUPABASE_URL +
        '/storage/v1/object/public/' +
        encodedBucket +
        '/' +
        encodedPath
      );

    }


    /* ============================================================
       SHOW ERROR
       ============================================================ */

    function showError(message) {

      console.error(
        'RESIBOOTH viewer error:',
        message
      );


      loading.style.display =
        'none';


      photo.style.display =
        'none';


      buttons.style.display =
        'none';


      info.style.display =
        'none';


      errorBox.style.display =
        'block';


      errorMessage.textContent =
        message ||
        'Please try scanning the QR code again.';


      subtitle.textContent =
        'Unable to load your photo.';

    }


    /* ============================================================
       SHOW PHOTO
       ============================================================ */

    function showPhoto(photoUrl) {

      loading.style.display =
        'none';


      errorBox.style.display =
        'none';


      photo.style.display =
        'block';


      buttons.style.display =
        'flex';


      info.style.display =
        'block';


      /*
       * Update subtitle.
       */

      if (variant === 'bw') {

        subtitle.textContent =
          'Your black & white photo';

      } else {

        subtitle.textContent =
          'Your colour photo';

      }


      /*
       * Show photo information.
       */

      info.textContent =
        'PHOTO ID: ' +
        photoId;


      /*
       * Download button.
       */

      downloadButton.href =
        photoUrl;

      downloadButton.download =
        'resibooth-' +
        photoId +
        '-' +
        variant +
        '.jpg';


      /*
       * Save button.
       */

      saveButton.onclick =
        function () {

          const link =
            document.createElement('a');

          link.href =
            photoUrl;

          link.download =
            'resibooth-' +
            photoId +
            '-' +
            variant +
            '.jpg';

          link.target =
            '_blank';

          link.rel =
            'noopener';

          document.body.appendChild(
            link
          );

          link.click();

          document.body.removeChild(
            link
          );

        };


      console.log(
        'Photo successfully displayed.'
      );

    }


    /* ============================================================
       LOAD PHOTO
       ============================================================ */

    function loadPhoto() {

      /*
       * Reset the page.
       */

      loading.style.display =
        'block';

      photo.style.display =
        'none';

      errorBox.style.display =
        'none';

      buttons.style.display =
        'none';

      info.style.display =
        'none';


      try {

        /*
         * Validate QR information.
         */

        validateParameters();


        /*
         * Build Supabase URL.
         */

        const photoUrl =
          getPhotoUrl();


        console.log(
          '================================='
        );

        console.log(
          'RESIBOOTH PHOTO VIEWER'
        );

        console.log(
          'Project:',
          projectRef ||
          '(not provided - using configured project)'
        );

        console.log(
          'Bucket:',
          BUCKET_NAME
        );

        console.log(
          'Photo ID:',
          photoId
        );

        console.log(
          'Variant:',
          variant
        );

        console.log(
          'Supabase file:',
          getFilePath()
        );

        console.log(
          'Photo URL:',
          photoUrl
        );

        console.log(
          '================================='
        );


        /*
         * Update subtitle while loading.
         */

        if (variant === 'bw') {

          subtitle.textContent =
            'Loading your black & white photo…';

        } else {

          subtitle.textContent =
            'Loading your colour photo…';

        }


        /*
         * Set image handlers BEFORE assigning src.
         */

        photo.onload =
          function () {

            showPhoto(
              photoUrl
            );

          };


        photo.onerror =
          function () {

            console.error(
              'Supabase image failed:',
              photoUrl
            );

            showError(
              'The photo could not be found. ' +
              'Please make sure the photo was uploaded successfully ' +
              'and that the "photos" bucket is public.'
            );

          };


        /*
         * Set photo URL.
         */

        photo.src =
          photoUrl;


        /*
         * Prepare download button.
         */

        downloadButton.href =
          photoUrl;

        downloadButton.download =
          'resibooth-' +
          photoId +
          '-' +
          variant +
          '.jpg';


      } catch (error) {

        console.error(
          'RESIBOOTH viewer error:',
          error
        );

        showError(
          error.message ||
          'We could not load your photo.'
        );

      }

    }


    /* ============================================================
       RETRY BUTTON
       ============================================================ */

    retryButton.onclick =
      function () {

        loadPhoto();

      };


    /* ============================================================
       START
       ============================================================ */

    loadPhoto();

  </script>

</body>
</html>
